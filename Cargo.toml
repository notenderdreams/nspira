[package]
name = "nspira"
version = "0.1.0"
edition = "2024"


[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
clap = { version = "4.5.50", features = ["derive"] }
dirs = "6.0.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
colored = "3.0.0"
ratatui = "0.27"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5.0"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
